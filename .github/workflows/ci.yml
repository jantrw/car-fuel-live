name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car-fuel-live-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and verify backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew build spotlessCheck dependencyCheckAnalyze

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: car-fuel-live-frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: car-fuel-live-frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
